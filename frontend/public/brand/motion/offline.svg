<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="256" height="256" role="img" aria-labelledby="title desc">
<title id="title">Pluten Offline</title>
<desc id="desc">The exact Pluten mark rotates ninety degrees clockwise and its own pieces smoothly become a centered standard Wi-Fi symbol, then reverse into the exact logo.</desc>
<defs><clipPath id="logoCircle"><circle cx="498.5" cy="494.5" r="341.5"/></clipPath></defs>
<style>
.piece{fill:#101313;clip-path:url(#logoCircle)}
.logo{transform-box:view-box;transform-origin:498.5px 494.5px;animation:offlineTurn 4.45s cubic-bezier(.16,1,.3,1) infinite}
@keyframes offlineTurn{
0%,14%{transform:rotate(0deg) scale(1)}
31%{transform:rotate(93deg) scale(.89)}
38%,76%{transform:rotate(90deg) scale(.89)}
91%{transform:rotate(-2deg) scale(1.006)}
100%{transform:rotate(0deg) scale(1)}
}
@media(prefers-reduced-motion:reduce){.logo{animation:none}}
</style>
