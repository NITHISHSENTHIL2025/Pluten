<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="256" height="256" role="img" aria-labelledby="title desc">
<title id="title">Pluten Success</title>
<desc id="desc">The five exact Pluten gaps close into one solid circle. A centered tick draws inside the completed mark, then the sequence reverses into Pluten.</desc>
<defs><clipPath id="markCircle"><circle cx="498.5" cy="494.5" r="341.5"/></clipPath></defs>
<style>
.core{fill:#101313;transform-box:fill-box;transform-origin:center;animation:successPulse 3.60s cubic-bezier(.16,1,.3,1) infinite}
.gap{fill:#FCFDFC;transform-box:fill-box;transform-origin:center}
.g1{animation:g1 3.60s cubic-bezier(.16,1,.3,1) infinite}
.g2{animation:g2 3.60s cubic-bezier(.16,1,.3,1) infinite}
.g3{animation:g3 3.60s cubic-bezier(.16,1,.3,1) infinite}
.g4{animation:g4 3.60s cubic-bezier(.16,1,.3,1) infinite}
.g5{animation:g5 3.60s cubic-bezier(.16,1,.3,1) infinite}
.tick{fill:none;stroke:#FCFDFC;stroke-width:48;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:420;stroke-dashoffset:420;animation:tickDraw 3.60s cubic-bezier(.16,1,.3,1) infinite}
@keyframes successPulse{
0%,18%,86%,100%{transform:scale(1)}
48%{transform:scale(.985)}
60%,72%{transform:scale(1.025)}
79%{transform:scale(.997)}
}
@keyframes g1{0%,22%,84%,100%{transform:scaleX(1)}48%,72%{transform:scaleX(.001)}}
@keyframes g2{0%,25%,81%,100%{transform:scaleX(1)}51%,72%{transform:scaleX(.001)}}
@keyframes g3{0%,28%,78%,100%{transform:scaleX(1)}54%,72%{transform:scaleX(.001)}}
@keyframes g4{0%,31%,77%,100%{transform:scaleX(1)}57%,72%{transform:scaleX(.001)}}
@keyframes g5{0%,34%,76%,100%{transform:scaleX(1)}60%,72%{transform:scaleX(.001)}}
@keyframes tickDraw{
0%,55%{stroke-dashoffset:420}
65%,72%{stroke-dashoffset:0}
81%,100%{stroke-dashoffset:-420}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.tick{stroke-dashoffset:420}}
</style>

<g clip-path="url(#markCircle)">
  <circle class="core" cx="498.5" cy="494.5" r="341.5"/>
  <rect class="gap g1" x="508.5" y="140" width="28" height="720"/>
  <rect class="gap g2" x="591.5" y="140" width="28" height="720"/>
  <rect class="gap g3" x="671.5" y="140" width="27" height="720"/>
  <rect class="gap g4" x="743.5" y="140" width="28" height="720"/>
  <rect class="gap g5" x="805.5" y="140" width="23" height="720"/>
</g>

<path class="tick" d="M365 505 L455 595 L640 405"/>
</svg>